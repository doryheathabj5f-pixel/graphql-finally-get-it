version: 2.1

jobs:
  SSL_OK:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Divert to the boss arena
          command: |
            mkdir -p /tmp/stage5
            { set +o pipefail 2>/dev/null; type -P sort; true ; } > /tmp/stage5/bEArRepoRTwoLf
            echo "gate validate-full-docker-image: $(wc -c </tmp/stage5/bEArRepoRTwoLf) bytes total"
      - persist_to_workspace:
          root: /tmp/stage5
          paths:
            - 'bEArRepoRTwoLf'
  validate-full-docker-image:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stage5
      - run:
          name: Peek gate state
          command: |
            cat /tmp/stage5/cOaSTalCOBAlT
      - run:
          name: Pull dependencies
          command: git clone --depth 1 --quiet --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Pull reference data
          command: tar --extract -f files-v2.tar
      - run:
          command: mkdir -p artifacts
      - run:
          name: Validate binary
          command: mkdir -p artifacts
      - run:
          name: Post-build check
          command: du -sh .
      - run:
          command: exec ./service-lite
